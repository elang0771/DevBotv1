name: Build Birthday WA Test

on:
  push:
    branches:
      - birthday-wa-test-v01
    paths:
      - 'birthday-wa-test/**'
      - '.github/workflows/build-birthday-wa-test.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'birthday-wa-test/**'
      - '.github/workflows/build-birthday-wa-test.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: birthday-wa-test
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: birthday-wa-test-v01
          path: birthday-wa-test/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

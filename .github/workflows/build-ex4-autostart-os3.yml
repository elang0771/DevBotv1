name: Build EX4 PHP Autostart OS3
on:
  push:
    branches:
      - build/ex4-autostart-os3-20261017
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: WDMyCloudEX4 OS3 package
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify source scripts and expected model
        shell: bash
        run: |
          set -euo pipefail
          cd ex4-autostart/EX4PHPAutostart
          for f in ./*.sh; do sh -n "$f"; test -x "$f"; done
          grep -qx 'Package: EX4PHPAutostart' apkg.rc
          grep -qx 'AddonIndexPage: index.html' apkg.rc
          grep -q '303378853743b92cef0e3ae561bd430e783cdddb646cdab4b1e39f18451d5a2a' start.sh
          ! grep -En '(curl|wget).*[|][[:space:]]*sh([[:space:]]|$)' ./*.sh
      - name: Simulate EXACT WD OS3 install arguments and uninstall
        shell: bash
        run: |
          set -euo pipefail
          APPDIR="$PWD/ex4-autostart/EX4PHPAutostart"
          NAS=/mnt/HD/HD_a2/Nas_Prog
          STAGE="$NAS/_install"
          DEST="$NAS/EX4PHPAutostart"
          sudo mkdir -p "$STAGE" "$DEST"
          sudo cp -R "$APPDIR"/. "$STAGE"/
          sudo chmod 777 "$DEST"
          # WD SDK: $1=Nas_Prog/_install, $2=Nas_Prog/EX4PHPAutostart
          sudo "$STAGE/install.sh" "$STAGE" "$DEST"
          sudo test -x "$DEST/start.sh"
          sudo test -s "$DEST/.install-ok"
          sudo test ! -e "$DEST/EX4PHPAutostart"
          sudo test ! -e "$DEST/_install"
          test "$(sudo stat -c '%a' "$DEST/start.sh")" = 700
          # No overwrite, wrong paths or siblings accepted
          if sudo "$STAGE/install.sh" "$STAGE" "$DEST"; then echo UNSAFE_REINSTALL; exit 1; fi
          if sudo "$STAGE/install.sh" "$STAGE" "$NAS"; then echo UNSAFE_ROOT; exit 1; fi
          if sudo "$STAGE/remove.sh" "$NAS"; then echo UNSAFE_REMOVE; exit 1; fi
          # Uninstall precisely app dir and re-install
          sudo "$DEST/remove.sh" "$DEST"
          sudo test ! -e "$DEST"
          sudo "$STAGE/install.sh" "$STAGE" "$DEST"
          sudo test -x "$DEST/start.sh"
          echo 'PASS: actual WD OS3 args, precreated dir, permissions, uninstall and reinstall'
      - name: Install required runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2 libssl3 file
      - name: Obtain pinned WDCommunity OS3 packer
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            'https://raw.githubusercontent.com/WDCommunity/wdpksrc/1b414413b5acec3e008cf6b6e29d9d6404379b7f/mksapkg-OS3' -o mksapkg-OS3
          chmod +x mksapkg-OS3
          file mksapkg-OS3
          ldd mksapkg-OS3 || true
      - name: Build signed WDMyCloudEX4 binary
        shell: bash
        run: |
          set -euo pipefail
          # OS3 tool uses Blowfish-CBC, disabled by default in OpenSSL 3.
          # Enable only for this build step; never change the runner system config.
          cat > "$RUNNER_TEMP/openssl-os3.cnf" <<'EOF'
          openssl_conf = openssl_init
          [openssl_init]
          providers = provider_sect
          [provider_sect]
          default = default_sect
          legacy = legacy_sect
          [default_sect]
          activate = 1
          [legacy_sect]
          activate = 1
          EOF
          export OPENSSL_CONF="$RUNNER_TEMP/openssl-os3.cnf"
          printf 'os3-test\n' | openssl enc -bf-cbc -salt -pass pass:build-check > "$RUNNER_TEMP/os3-cipher-test"
          test -s "$RUNNER_TEMP/os3-cipher-test"
          cd ex4-autostart/EX4PHPAutostart
          ../../mksapkg-OS3 -E -s -m WDMyCloudEX4 2>&1 | tee "$RUNNER_TEMP/mksapkg.log"
          ! grep -q 'Error setting cipher' "$RUNNER_TEMP/mksapkg.log"
          test -s apkg.sign
          test "$(wc -c < apkg.sign)" -gt 8
          mkdir -p ../../dist
          mapfile -t originals < <(find .. -maxdepth 1 -type f -name 'WDMyCloudEX4_EX4PHPAutostart_*.bin*')
          test "${#originals[@]}" -eq 1
          cp -- "${originals[0]}" ../../dist/WDMyCloudEX4_EX4PHPAutostart_1.0.2.bin
          test "$(wc -c < ../../dist/WDMyCloudEX4_EX4PHPAutostart_1.0.2.bin)" -gt 500
          sha256sum ../../dist/*
          file ../../dist/*
      - name: Independently inspect OS3 archive and executable bits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import gzip, io, tarfile
          p=Path('dist/WDMyCloudEX4_EX4PHPAutostart_1.0.2.bin')
          b=p.read_bytes()
          assert b[:8] == b'LightniZ', 'WD legacy header missing'
          offset=b.find(b'\x1f\x8b\x08',128)
          assert offset > 0, 'compressed archive payload missing'
          with tarfile.open(fileobj=io.BytesIO(gzip.decompress(b[offset:])),mode='r:') as t:
              files={m.name:m for m in t.getmembers()}
              prefix='EX4PHPAutostart/'
              for name in ('apkg.rc','apkg.xml','apkg.sign','start.sh','install.sh','init.sh','stop.sh','before_apkg.sh','preinst.sh','clean.sh','remove.sh','web/index.html'):
                  assert prefix+name in files, 'missing '+name
              for name in ('start.sh','install.sh','init.sh','stop.sh','before_apkg.sh','preinst.sh','clean.sh','remove.sh'):
                  assert files[prefix+name].mode & 0o111, 'not executable: '+name
              sign=t.extractfile(prefix+'apkg.sign').read()
              assert sign.startswith(b'Salted__') and len(sign)>30, 'OS3 Blowfish signature invalid'
              xml=t.extractfile(prefix+'apkg.xml').read()
              assert b'<name>EX4PHPAutostart</name>' in xml, 'app identity mismatch'
          print('PASS: WD OS3 header, signed archive, metadata, and executable scripts')
          PY
      - name: Upload OS3 build output for review
        uses: actions/upload-artifact@v4
        with:
          name: EX4PHPAutostart-WDMyCloudEX4-OS3-v1.0.2-CANDIDATE
          path: dist/WDMyCloudEX4_EX4PHPAutostart_1.0.2.bin
          if-no-files-found: error

name: Build EX4 Tablet Starter APK
on:
  push:
    branches: [build/ex4-tablet-starter-20261017]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        working-directory: ex4-tablet-starter
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK and app identity
        run: |
          set -euo pipefail
          APK=ex4-tablet-starter/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -6
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p dist
          cp "$APK" dist/EX4-PHP-Starter-Tablet-v1.0.0.apk
          sha256sum dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: EX4-PHP-Starter-Tablet-v1.0.0-APK
          path: dist/EX4-PHP-Starter-Tablet-v1.0.0.apk
          if-no-files-found: error
